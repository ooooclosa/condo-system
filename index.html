<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condo Ticketing System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-primary text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fa fa-building mr-2"></i>Condo Request System</h1>
            <div id="nav-buttons">
                <button onclick="showSection('submit')" class="px-3 py-1 rounded hover:bg-white/20">Submit Request</button>
                <button onclick="showSection('view')" class="px-3 py-1 rounded hover:bg-white/20">View Status</button>
                <button onclick="showSection('admin')" class="px-3 py-1 rounded hover:bg-white/20">Admin</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-4xl">

        <!-- SUBMIT TICKET SECTION -->
        <section id="submit" class="section">
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h2 class="text-2xl font-bold mb-4 text-gray-700">Submit New Request</h2>
                <form id="ticketForm" class="space-y-4">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Unit Number *</label>
                            <input type="text" id="unit" required class="w-full p-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Full Name *</label>
                            <input type="text" id="name" required class="w-full p-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Contact Number *</label>
                            <input type="tel" id="contact" required class="w-full p-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Type of Request *</label>
                            <select id="type" required class="w-full p-2 border rounded">
                                <option value="Repair">Repair</option>
                                <option value="Complaint">Complaint</option>
                                <option value="Cleaning">Cleaning / Housekeeping</option>
                                <option value="Plumbing">Plumbing</option>
                                <option value="Electrical">Electrical</option>
                                <option value="Security">Security Concern</option>
                                <option value="Other">Others</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Subject / Title *</label>
                        <input type="text" id="subject" required class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Description / Details *</label>
                        <textarea id="description" rows="4" required class="w-full p-2 border rounded" placeholder="Explain clearly what you need or what happened..."></textarea>
                    </div>
                    <!-- NEW: FILE UPLOAD -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Attach Photo / Proof (Optional)</label>
                        <input type="file" id="photo" accept="image/*" class="w-full p-1.5 border rounded text-sm">
                    </div>
                    <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:bg-primary/90">
                        <i class="fa fa-paper-plane mr-2"></i>Submit Request
                    </button>
                </form>
            </div>
        </section>

        <!-- VIEW STATUS SECTION -->
        <section id="view" class="section hidden">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-2xl font-bold mb-4 text-gray-700">Track Your Request</h2>
                <p class="text-sm text-gray-500 mb-4">You can check status here. Filter by your Unit Number.</p>
                
                <div class="mb-4">
                    <input type="text" id="filterUnit" placeholder="Enter your Unit Number to filter" class="p-2 border rounded w-full md:w-1/3">
                    <button onclick="filterTickets()" class="ml-2 bg-gray-200 px-3 py-1 rounded">Filter</button>
                    <button onclick="loadTickets()" class="ml-2 text-blue-600">Show All</button>
                </div>

                <div id="ticketsList" class="space-y-3">
                    <!-- Tickets load here -->
                </div>
            </div>
        </section>

        <!-- ADMIN SECTION -->
        <section id="admin" class="section hidden">
            <div id="adminLogin" class="bg-white rounded-lg shadow p-6 max-w-md mx-auto">
                <h2 class="text-2xl font-bold mb-4 text-gray-700 text-center">Admin Login</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
                        <input type="password" id="adminPass" class="w-full p-2 border rounded" placeholder="Enter admin password">
                    </div>
                    <button onclick="adminLogin()" class="w-full bg-primary text-white py-2 rounded hover:bg-primary/90">Login</button>
                </div>
            </div>

            <div id="adminPanel" class="hidden">
                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold text-gray-700">Admin Dashboard</h2>
                        <button onclick="adminLogout()" class="text-red-600">Logout</button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse">
                            <thead>
                                <tr class="bg-gray-100">
                                    <th class="border p-2 text-left">Ticket #</th>
                                    <th class="border p-2 text-left">Unit</th>
                                    <th class="border p-2 text-left">Name</th>
                                    <th class="border p-2 text-left">Type</th>
                                    <th class="border p-2 text-left">Status</th>
                                    <th class="border p-2 text-left">Photo</th>
                                    <th class="border p-2 text-left">Action</th>
                                </tr>
                            </thead>
                            <tbody id="adminTickets">
                                <!-- Admin tickets here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script>
        // --- CONFIGURATION ---
        const ADMIN_PASSWORD = "manager123"; // ✅ CHANGE THIS TO YOUR OWN PASSWORD
        let tickets = JSON.parse(localStorage.getItem('condoTickets')) || [];

        // --- NAVIGATION ---
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            
            if(id === 'view') loadTickets();
            if(id === 'admin' && localStorage.getItem('adminLoggedIn') === 'true') {
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadAdminTickets();
            }
        }

        // --- SUBMIT TICKET WITH PHOTO ---
        document.getElementById('ticketForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const photoInput = document.getElementById('photo');
            let photoData = null;

            // Convert image to saveable format
            if (photoInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    saveTicketData(event.target.result);
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                saveTicketData(null);
            }
        });

        function saveTicketData(photoData) {
            const newTicket = {
                id: Date.now(),
                unit: document.getElementById('unit').value,
                name: document.getElementById('name').value,
                contact: document.getElementById('contact').value,
                type: document.getElementById('type').value,
                subject: document.getElementById('subject').value,
                description: document.getElementById('description').value,
                status: 'New',
                date: new Date().toLocaleString(),
                photo: photoData // Save image data
            };

            tickets.unshift(newTicket);
            saveTickets();
            alert('✅ Request submitted successfully! Ticket ID: ' + newTicket.id);
            document.getElementById('ticketForm').reset();
        }

        // --- LOAD & DISPLAY TICKETS ---
        function loadTickets(filterUnit = '') {
            const listEl = document.getElementById('ticketsList');
            let filtered = tickets;

            if(filterUnit) {
                filtered = tickets.filter(t => t.unit.toLowerCase() === filterUnit.toLowerCase());
            }

            if(filtered.length === 0) {
                listEl.innerHTML = '<p class="text-gray-500 italic">No requests found.</p>';
                return;
            }

            listEl.innerHTML = '';
            filtered.forEach(ticket => {
                const statusColor = ticket.status === 'New' ? 'bg-red-100 text-red-800' : 
                                   ticket.status === 'In Progress' ? 'bg-yellow-100 text-yellow-800' : 
                                   ticket.status === 'Completed' ? 'bg-green-100 text-green-800' : 'bg-gray-100';

                listEl.innerHTML += `
                    <div class="border rounded p-4 hover:shadow-sm">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg">#${ticket.id} - ${ticket.subject}</h3>
                            <span class="text-xs px-2 py-1 rounded-full ${statusColor}">${ticket.status}</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-1"><strong>Unit:</strong> ${ticket.unit} | <strong>Name:</strong> ${ticket.name} | <strong>Date:</strong> ${ticket.date}</p>
                        <p class="text-sm mb-1"><strong>Type:</strong> ${ticket.type}</p>
                        <p class="text-sm text-gray-700 mb-2">${ticket.description}</p>
                        ${ticket.photo ? `<img src="${ticket.photo}" class="max-w-xs max-h-40 rounded border">` : ''}
                    </div>
                `;
            });
        }

        function filterTickets() {
            const unit = document.getElementById('filterUnit').value.trim();
            loadTickets(unit);
        }

        // --- ADMIN FUNCTIONS ---
        function adminLogin() {
            const pass = document.getElementById('adminPass').value;
            if(pass === ADMIN_PASSWORD) {
                localStorage.setItem('adminLoggedIn', 'true');
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadAdminTickets();
            } else {
                alert('❌ Wrong password!');
            }
        }

        function adminLogout() {
            localStorage.removeItem('adminLoggedIn');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminLogin').classList.remove('hidden');
        }

        function loadAdminTickets() {
            const tbody = document.getElementById('adminTickets');
            tbody.innerHTML = '';

            tickets.forEach(ticket => {
                const statusColor = ticket.status === 'New' ? 'bg-red-50' : 
                                   ticket.status === 'In Progress' ? 'bg-yellow-50' : 
                                   ticket.status === 'Completed' ? 'bg-green-50' : 'bg-gray-50';

                tbody.innerHTML += `
                    <tr class="${statusColor}">
                        <td class="border p-2 text-sm">${ticket.id}</td>
                        <td class="border p-2 text-sm">${ticket.unit}</td>
                        <td class="border p-2 text-sm">${ticket.name}</td>
                        <td class="border p-2 text-sm">${ticket.type}</td>
                        <td class="border p-2 text-sm">
                            <select onchange="updateStatus(${ticket.id}, this.value)" class="w-full p-1 border rounded text-sm">
                                <option value="New" ${ticket.status==='New'?'selected':''}>New</option>
                                <option value="In Progress" ${ticket.status==='In Progress'?'selected':''}>In Progress</option>
                                <option value="Completed" ${ticket.status==='Completed'?'selected':''}>Completed</option>
                                <option value="Closed" ${ticket.status==='Closed'?'selected':''}>Closed</option>
                            </select>
                        </td>
                        <td class="border p-2 text-sm">
                            ${ticket.photo ? `<a href="${ticket.photo}" target="_blank" class="text-blue-600">View Photo</a>` : '—'}
                        </td>
                        <td class="border p-2 text-sm">
                            <button onclick="deleteTicket(${ticket.id})" class="text-red-600 text-xs">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateStatus(id, newStatus) {
            const idx = tickets.findIndex(t => t.id === id);
            if(idx !== -1) {
                tickets[idx].status = newStatus;
                saveTickets();
            }
        }

        function deleteTicket(id) {
            if(confirm('Delete this ticket? Cannot undo.')) {
                tickets = tickets.filter(t => t.id !== id);
                saveTickets();
                loadAdminTickets();
            }
        }

        // --- SAVE DATA ---
        function saveTickets() {
            localStorage.setItem('condoTickets', JSON.stringify(tickets));
        }

        // --- INIT ---
        showSection('submit');
    </script>
</body>
</html>

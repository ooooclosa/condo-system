<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condo Ticketing System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-primary text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fa fa-building mr-2"></i>Condo Request System</h1>
            <div id="nav-buttons">
                <button onclick="showSection('submit')" class="px-3 py-1 rounded hover:bg-white/20">Submit Request</button>
                <button onclick="showSection('view')" class="px-3 py-1 rounded hover:bg-white/20">View Status</button>
                <button onclick="showSection('admin')" class="px-3 py-1 rounded hover:bg-white/20">Admin</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-4xl">

        <!-- SUBMIT TICKET SECTION -->
        <section id="submit" class="section">
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h2 class="text-2xl font-bold mb-4 text-gray-700">Submit New Request</h2>
                <form id="ticketForm" class="space-y-4">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Unit Number *</label>
                            <input type="text" id="unit" required class="w-full p-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Full Name *</label>
                            <input type="text" id="name" required class="w-full p-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Contact Number *</label>
                            <input type="tel" id="contact" required class="w-full p-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Type of Request *</label>
                            <select id="type" required class="w-full p-2 border rounded">
                                <option value="Repair">Repair</option>
                                <option value="Complaint">Complaint</option>
                                <option value="Cleaning">Cleaning / Housekeeping</option>
                                <option value="Plumbing">Plumbing</option>
                                <option value="Electrical">Electrical</option>
                                <option value="Security">Security Concern</option>
                                <option value="Other">Others</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Subject / Title *</label>
                        <input type="text" id="subject" required class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Description / Details *</label>
                        <textarea id="description" rows="4" required class="w-full p-2 border rounded" placeholder="Explain clearly what you need or what happened..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Attach Photo (Optional)</label>
                        <input type="file" id="photo" accept="image/*" class="w-full p-1.5 border rounded text-sm">
                    </div>
                    <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:bg-primary/90">
                        <i class="fa fa-paper-plane mr-2"></i>Submit Request
                    </button>
                </form>
            </div>
        </section>

        <!-- VIEW STATUS SECTION -->
        <section id="view" class="section hidden">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-2xl font-bold mb-4 text-gray-700">Track Your Request</h2>
                <p class="text-sm text-gray-500 mb-4">Filter by your Unit Number to see status.</p>
                
                <div class="mb-4">
                    <input type="text" id="filterUnit" placeholder="Enter Unit Number" class="p-2 border rounded w-full md:w-1/3">
                    <button onclick="loadTicketsFromSheet()" class="ml-2 bg-gray-200 px-3 py-1 rounded">Filter</button>
                    <button onclick="loadTicketsFromSheet()" class="ml-2 text-blue-600">Show All</button>
                </div>

                <div id="ticketsList" class="space-y-3"></div>
            </div>
        </section>

        <!-- ADMIN SECTION -->
        <section id="admin" class="section hidden">
            <div id="adminLogin" class="bg-white rounded-lg shadow p-6 max-w-md mx-auto">
                <h2 class="text-2xl font-bold mb-4 text-gray-700 text-center">Admin Login</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
                        <input type="password" id="adminPass" class="w-full p-2 border rounded" placeholder="Enter password">
                    </div>
                    <button onclick="adminLogin()" class="w-full bg-primary text-white py-2 rounded hover:bg-primary/90">Login</button>
                </div>
            </div>

            <div id="adminPanel" class="hidden">
                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold text-gray-700">Admin Dashboard</h2>
                        <button onclick="adminLogout()" class="text-red-600">Logout</button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse">
                            <thead>
                                <tr class="bg-gray-100">
                                    <th class="border p-2 text-left">Ticket #</th>
                                    <th class="border p-2 text-left">Unit</th>
                                    <th class="border p-2 text-left">Name</th>
                                    <th class="border p-2 text-left">Type</th>
                                    <th class="border p-2 text-left">Status</th>
                                    <th class="border p-2 text-left">Photo</th>
                                    <th class="border p-2 text-left">Action</th>
                                </tr>
                            </thead>
                            <tbody id="adminTickets"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script>
        // --------------------------
        // ✅ CONFIGURE THESE FIRST ✅
        // --------------------------
        const GOOGLE_SCRIPT_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";
        const ADMIN_PASSWORD = "manager123"; // CHANGE THIS PASSWORD

        // --- NAVIGATION ---
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            
            if(id === 'view') loadTicketsFromSheet();
            if(id === 'admin' && localStorage.getItem('adminLoggedIn') === 'true') {
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadTicketsFromSheet(true);
            }
        }

        // --- SUBMIT TICKET ---
        document.getElementById('ticketForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const photoInput = document.getElementById('photo');
            let photoData = "";

            if (photoInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    photoData = event.target.result;
                    sendDataToSheet(photoData);
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                sendDataToSheet("");
            }
        });

        function sendDataToSheet(photo) {
            const formData = {
                action: "submit",
                id: Date.now(),
                unit: document.getElementById('unit').value,
                name: document.getElementById('name').value,
                contact: document.getElementById('contact').value,
                type: document.getElementById('type').value,
                subject: document.getElementById('subject').value,
                description: document.getElementById('description').value,
                status: "New",
                date: new Date().toLocaleString(),
                photo: photo
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(formData)
            }).then(() => {
                alert("✅ Request submitted successfully!");
                document.getElementById('ticketForm').reset();
            });
        }

        // --- LOAD TICKETS FROM GOOGLE SHEETS ---
        function loadTicketsFromSheet(isAdmin = false) {
            const filterUnit = document.getElementById('filterUnit')?.value.trim() || "";

            fetch(GOOGLE_SCRIPT_URL + "?action=get&unit=" + filterUnit)
            .then(res => res.json())
            .then(data => {
                if(isAdmin) {
                    renderAdminTickets(data);
                } else {
                    renderPublicTickets(data);
                }
            });
        }

        function renderPublicTickets(tickets) {
            const listEl = document.getElementById('ticketsList');
            if(tickets.length === 0) {
                listEl.innerHTML = '<p class="text-gray-500 italic">No requests found.</p>';
                return;
            }

            listEl.innerHTML = "";
            tickets.forEach(t => {
                const color = t.status === 'New' ? 'bg-red-100' : t.status === 'In Progress' ? 'bg-yellow-100' : 'bg-green-100';
                listEl.innerHTML += `
                    <div class="border rounded p-4 hover:shadow-sm">
                        <div class="flex justify-between mb-2">
                            <h3 class="font-bold">#${t.id} - ${t.subject}</h3>
                            <span class="text-xs px-2 py-1 rounded-full ${color}">${t.status}</span>
                        </div>
                        <p class="text-sm"><strong>Unit:</strong> ${t.unit} | <strong>Date:</strong> ${t.date}</p>
                        <p class="text-sm mt-1">${t.description}</p>
                        ${t.photo ? `<img src="${t.photo}" class="mt-2 max-w-xs max-h-32 rounded border">` : ''}
                    </div>
                `;
            });
        }

        function renderAdminTickets(tickets) {
            const tbody = document.getElementById('adminTickets');
            tbody.innerHTML = "";
            tickets.forEach(t => {
                const color = t.status === 'New' ? 'bg-red-50' : t.status === 'In Progress' ? 'bg-yellow-50' : 'bg-green-50';
                tbody.innerHTML += `
                    <tr class="${color}">
                        <td class="border p-2 text-sm">${t.id}</td>
                        <td class="border p-2 text-sm">${t.unit}</td>
                        <td class="border p-2 text-sm">${t.name}</td>
                        <td class="border p-2 text-sm">${t.type}</td>
                        <td class="border p-2 text-sm">
                            <select onchange="updateStatus('${t.id}', this.value)" class="p-1 border rounded">
                                <option ${t.status==='New'?'selected':''}>New</option>
                                <option ${t.status==='In Progress'?'selected':''}>In Progress</option>
                                <option ${t.status==='Completed'?'selected':''}>Completed</option>
                                <option ${t.status==='Closed'?'selected':''}>Closed</option>
                            </select>
                        </td>
                        <td class="border p-2 text-sm">
                            ${t.photo ? `<a href="${t.photo}" target="_blank" class="text-blue-600">View</a>` : '—'}
                        </td>
                        <td class="border p-2 text-sm">
                            <button onclick="deleteTicket('${t.id}')" class="text-red-600 text-xs">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        // --- UPDATE / DELETE ---
        function updateStatus(id, newStatus) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({action:"update", id:id, status:newStatus})
            }).then(() => alert("✅ Status updated"));
        }

        function deleteTicket(id) {
            if(confirm("Delete this ticket?")) {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({action:"delete", id:id})
                }).then(() => loadTicketsFromSheet(true));
            }
        }

        // --- ADMIN LOGIN ---
        function adminLogin() {
            if(document.getElementById('adminPass').value === ADMIN_PASSWORD) {
                localStorage.setItem('adminLoggedIn', 'true');
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadTicketsFromSheet(true);
            } else alert("❌ Wrong password");
        }
        function adminLogout() {
            localStorage.removeItem('adminLoggedIn');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminLogin').classList.remove('hidden');
        }

        // --- INIT ---
        showSection('submit');
    </script>
</body>
</html>
